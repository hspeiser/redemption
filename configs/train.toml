# ============================================================================
# YOLO-Pose training config -- LAMBDA A100 (40 GB SXM4) branch.
#
# Dedicated box (not shared), so NO GPU memory cap. Iterate model size with a
# ONE-LINE edit: set [model].active to nano | medium | xpose and re-run
# scripts/train_model.py. All three train on the SAME dataset on ~/binglebob
# (no data regen). Data + runs live on the persistent NFS mount; the dataset is
# RAM-cached at train start so NFS is read only once.
# ============================================================================

[data]
dataset_name = "gates_xl"                  # must match datagen.toml [dataset].name
dataset_root = "/home/ubuntu/binglebob/datasets"

[model]
# One-line model switch: nano | medium | xpose | finetune
active = "finetune"

[model.finetune]
# Fine-tune our synthetic-pretrained nano on Henry's REAL auto-labeled data.
# Keeps the strong detector (92.6% real detection) and sharpens corners on real imagery.
weights = "/home/ubuntu/binglebob/checkpoints/gate_nano_best.pt"
batch = 64
name = "gates_real_ft"

[model.nano]
weights = "yolo11n-pose.pt"
batch = 256                                # tiny model; A100 40GB has tons of room
name = "gates_nano"

[model.medium]
weights = "yolo11m-pose.pt"
batch = 48                                 # ~23 GB @ 640 on 40 GB
name = "gates_medium"

[model.xpose]
weights = "yolo11x-pose.pt"
batch = 16                                 # big model; lower to 12 if it OOMs
name = "gates_xpose"

[train]
epochs = 40                                # fine-tune: fewer epochs from a strong init
batch = 16                                 # fallback for legacy schema (unused when [model].active set)
gpu_mem_fraction = 0                       # dedicated box -> no cap
lr0 = 0.003                                # fine-tune LR (not from-scratch); Henry's v3 recipe
pose = 14.0                                # weight pose/keypoint loss up (corner precision is the goal)
kobj = 1.5
cache = "ram"                              # load dataset into RAM once (dataset is on NFS; 200 GB RAM)
imgsz = 640
device = 0
workers = 16                               # of 30 vCPUs
amp = true
patience = 30
seed = 0
cos_lr = true
project = "/home/ubuntu/binglebob/runs"    # checkpoints persist on the NFS drive
name = "gates_pose"                        # fallback name (profiles set their own)
exist_ok = false

[checkpoints]
save = true
save_period = 10

[augment]
hsv_h = 0.015
hsv_s = 0.5
hsv_v = 0.4
degrees = 0.0
translate = 0.1
scale = 0.4
fliplr = 0.5
mosaic = 0.4                               # less mosaic: keep big/close gates big (Henry's note)
mixup = 0.0

[progress]
eval_subset = 200
overlay_samples = 12

[live]
# Live in-process progress dashboard each epoch.
enabled = true
subset_images = 100                        # images for the (synthetic-only) PnP reconstruction eval
device = 0
val_corner_eval = true                     # ALSO track corner RMSE on the real val set each epoch
val_corner_images = 150                    # val subset for that (cached once) -> convergence curve on the GUI
