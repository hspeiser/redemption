[project]
name = "aigp"
version = "0.1.0"
description = "AI-GP autonomous drone racing stack"
requires-python = ">=3.12"
dependencies = [
    "pymavlink>=2.4",
    "numpy",
    "opencv-python",
    "scipy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aigp"]
