[project]
name = "redemption"
version = "0.1.0"
description = "Synthetic YOLO-Pose pipeline for detecting inner corners of orange racing gates + PnP pose recovery"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "ultralytics>=8.3.0",
    "torch>=2.7.0",
    "torchvision>=0.22.0",
    "opencv-python>=4.10.0",
    "numpy>=1.26,<2.2",
    "scipy>=1.13",
    "matplotlib>=3.8",
    "pandas>=2.2",
    "tqdm>=4.66",
    "rich>=13.7",
    "pyyaml>=6.0",
]

# ---------------------------------------------------------------------------
# GPU wheels -- gipsydanger-medium branch.
# The RTX 5090 is Blackwell (sm_120) and REQUIRES CUDA 12.8 kernels, so we pull
# the cu128 PyTorch wheels (torch >= 2.7). The cu124 wheels used on the local
# RTX 3050 (Ampere) have no Blackwell kernels and would fail here.
# ---------------------------------------------------------------------------
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/redemption"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
