[project]
name = "redemption"
version = "0.1.0"
description = "Synthetic YOLO-Pose pipeline for detecting inner corners of orange racing gates + PnP pose recovery"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "ultralytics>=8.3.0",
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "opencv-python>=4.10.0",
    "numpy>=1.26,<2.2",
    "scipy>=1.13",
    "matplotlib>=3.8",
    "pandas>=2.2",
    "tqdm>=4.66",
    "rich>=13.7",
    "pyyaml>=6.0",
]

# ---------------------------------------------------------------------------
# GPU wheels. The RTX 3050 (driver 591.74, CUDA 12.6 runtime) is served by the
# cu124 PyTorch wheels, which are forward-compatible with a 12.6 driver.
# `uv sync` will pull torch/torchvision from the dedicated index below.
# ---------------------------------------------------------------------------
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/redemption"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
